name: UCSF VAL-01A Validation

on:
  push:
    branches:
      - ucsf/val-01-val-02b-integration
  pull_request:
    paths:
      - 'validation/VAL-01A/**'
      - '.github/workflows/validation-val01a.yml'

jobs:
  val-01a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run VAL-01A reference tests
        working-directory: validation/VAL-01A
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
